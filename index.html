<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#1a0f1f">
    <meta name="description" content="Suh &amp; Lele — contador de dias juntos, nas duas vidas.">
    <meta property="og:title" content="Suh &amp; Lele">
    <meta property="og:description" content="Contador de dias juntos, nas duas vidas.">
    <meta property="og:image" content="iconsuh.png">
    <link rel="icon" href="iconsuh.png">
    <title>Suh &amp; Lele</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Playfair+Display:ital,wght@1,500;1,700&display=swap" rel="stylesheet">
    <style>
        :root {
            --ink: #fff;
            --ink-soft: rgba(255, 255, 255, .78);
            --gold: #ffd86b;
            --destaque: clamp(4.2rem, 20vw, 5.6rem); /* tamanho único dos quatro números (dias juntos + os três contadores) */
            --rose: #ff6b8b;
            --glass: rgba(24, 12, 30, .32);
            --glass-line: rgba(255, 255, 255, .22);
            --serif: "Playfair Display", Georgia, serif;
            --sans: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        html { background: #1a0f1f; }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            color: var(--ink);
            font-family: var(--sans);
            -webkit-font-smoothing: antialiased;
        }

        .video-background {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: -1;
            transition: opacity .3s ease-in-out;
        }

        /* véu escuro: deixa o texto legível sobre qualquer vídeo */
        body::before {
            content: "";
            position: fixed;
            inset: 0;
            z-index: 0;
            pointer-events: none;
            background: linear-gradient(to bottom,
                rgba(26, 15, 31, .55) 0%,
                rgba(26, 15, 31, 0) 28%,
                rgba(26, 15, 31, 0) 70%,
                rgba(26, 15, 31, .6) 100%);
        }

        .content {
            position: fixed;
            inset: 0;
            z-index: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 1.1rem;
            padding: max(1.25rem, env(safe-area-inset-top)) 1rem 7.5rem;
            text-align: center;
            overflow-y: auto;
            text-shadow: 0 2px 12px rgba(0, 0, 0, .55);
            animation: fadeUp .7s ease both;
        }

        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(14px); }
            to   { opacity: 1; transform: none; }
        }

        #timer {
            font-size: .72rem;
            font-weight: 500;
            letter-spacing: .08em;
            text-transform: uppercase;
            color: var(--ink-soft);
            padding: .3rem .8rem;
            border: 1px solid var(--glass-line);
            border-radius: 999px;
            background: var(--glass);
            text-shadow: none;
        }
        #timer::before { content: "menu some em "; }
        #timer::after  { content: "s"; }

        .names {
            font-family: var(--serif);
            font-style: italic;
            font-weight: 700;
            font-size: clamp(2.6rem, 11vw, 4.6rem);
            line-height: 1.05;
            margin-top: .4rem;
        }
        .names span { color: var(--rose); padding: 0 .1em; }

        /* O 696 sozinho no topo saiu: os três contadores (Primeira Vida, Na Outra Vida e Namoro) são o destaque principal, iguais, logo abaixo do nome.
           O elemento continua no DOM só porque o script ainda o preenche. */
        #days-together-second {
            display: none;
            flex-direction: column;
            align-items: center;
            font-weight: 500;
            line-height: 1;
            color: var(--gold);
        }
        #days-together-second .big {
            font-family: var(--serif);
            font-style: italic;
            font-weight: 700;
            font-size: var(--destaque);
            text-shadow: 0 0 22px rgba(255, 216, 107, .4), 0 2px 12px rgba(0, 0, 0, .55);
        }
        #days-together-second .unit {
            font-size: .85rem;
            letter-spacing: .28em;
            text-transform: uppercase;
            color: var(--ink);
            margin-top: .9rem;
        }

        #current-date {
            font-size: .95rem;
            color: var(--ink-soft);
        }

        .cards {
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: .9rem;
            width: min(100%, 50rem);
            margin-top: .3rem;
        }

        .counter {
            background: var(--glass);
            border: 1px solid var(--glass-line);
            border-radius: 20px;
            padding: 1.1rem .9rem 1rem;
            backdrop-filter: blur(14px) saturate(140%);
            -webkit-backdrop-filter: blur(14px) saturate(140%);
            box-shadow: 0 10px 30px rgba(0, 0, 0, .3);
            text-shadow: none;
        }
        .counter h2 {
            font-family: var(--serif);
            font-style: italic;
            font-weight: 500;
            font-size: 1.25rem;
            color: var(--ink);
        }
        .counter .date {
            font-size: .72rem;
            letter-spacing: .14em;
            text-transform: uppercase;
            color: var(--ink-soft);
            margin: .25rem 0 .7rem;
        }
        .counter .days {
            display: flex;
            flex-direction: column;
            align-items: center;
            line-height: 1;
            color: var(--gold);
        }
        .counter .days .big {
            font-family: var(--serif);
            font-style: italic;
            font-weight: 700;
            font-size: var(--destaque);
            text-shadow: 0 0 22px rgba(255, 216, 107, .4), 0 2px 12px rgba(0, 0, 0, .55);
        }
        .counter .days .unit {
            margin-top: .45rem;
            font-size: .72rem;
            letter-spacing: .28em;
            text-transform: uppercase;
            color: var(--ink);
        }
        .counter .detail {
            margin-top: .55rem;
            font-size: .78rem;
            color: var(--ink-soft);
            font-variant-numeric: tabular-nums;
        }

        .music-player {
            position: fixed;
            left: 0;
            right: 0;
            bottom: max(1.25rem, env(safe-area-inset-bottom));
            z-index: 2;
            display: flex;
            justify-content: center;
            padding: 0 1rem;
        }

        .play-button {
            display: flex;
            align-items: center;
            gap: .85rem;
            width: min(100%, 20rem);
            padding: .7rem 1.1rem .7rem .8rem;
            border: 1px solid var(--glass-line);
            border-radius: 999px;
            background: rgba(255, 255, 255, .9);
            color: #1a0f1f;
            font-family: var(--sans);
            text-align: left;
            cursor: pointer;
            box-shadow: 0 10px 30px rgba(0, 0, 0, .4);
            transition: transform .2s ease, background-color .2s ease;
        }
        .play-button:hover { transform: translateY(-2px); background: #fff; }
        .play-button:active { transform: scale(.98); }
        .play-button:focus-visible { outline: 3px solid var(--gold); outline-offset: 3px; }

        .play-button .icon {
            flex: none;
            display: grid;
            place-items: center;
            width: 2.6rem;
            height: 2.6rem;
            border-radius: 50%;
            background: var(--rose);
            color: #fff;
            font-size: 1rem;
        }
        .play-button .icon::before { content: "▶"; margin-left: 2px; }
        .play-button.playing .icon::before { content: "❚❚"; margin-left: 0; font-size: .8rem; letter-spacing: -2px; }

        .button-label { font-size: .95rem; font-weight: 600; color: #1a0f1f; }
        .music-name { font-size: .75rem; color: rgba(26, 15, 31, .65); margin-top: 2px; }

        .tap-message {
            display: none;
            position: absolute;
            bottom: calc(100% + .6rem);
            left: 50%;
            transform: translateX(-50%);
            white-space: nowrap;
            font-size: .85rem;
            color: var(--ink);
            padding: .45rem .9rem;
            border-radius: 999px;
            background: var(--glass);
            border: 1px solid var(--glass-line);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            animation: pulse 2s ease-in-out infinite;
        }
        .tap-message.show { display: block; }

        @keyframes pulse { 50% { opacity: .55; } }

        /* coração que cai */
        .falling-heart {
            position: absolute;
            top: -100px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 4rem;
            z-index: 9999;
            display: none;
            cursor: pointer;
            filter: drop-shadow(0 4px 10px rgba(0, 0, 0, .5));
        }
        @keyframes fall { 0% { top: -100px; } 100% { top: 100%; } }
        @keyframes zigzag {
            0%, 100% { transform: translateX(-50%) rotate(0); }
            20% { transform: translateX(calc(-50% - 90px)) rotate(-12deg); }
            40% { transform: translateX(calc(-50% + 70px)) rotate(10deg); }
            60% { transform: translateX(calc(-50% - 60px)) rotate(-8deg); }
            80% { transform: translateX(calc(-50% + 90px)) rotate(12deg); }
        }

        /* ícone do Flap Suh */
        #iconImage {
            position: fixed;
            bottom: 50%;
            right: 5%;
            width: 80px;
            height: 80px;
            object-fit: contain;
            opacity: 0;
            cursor: pointer;
            z-index: 10000;
            transform: translateY(50%);
            animation: slideInOut 5s ease-in-out forwards;
            filter: drop-shadow(0 4px 10px rgba(0, 0, 0, .5));
        }
        @keyframes slideInOut {
            0%   { opacity: 0; transform: translateX(100%); }
            30%  { opacity: 1; transform: translateX(0); }
            70%  { opacity: 1; transform: translateX(0); }
            100% { opacity: 0; transform: translateX(100%); }
        }

        @media (max-width: 640px) {
            .cards { grid-template-columns: minmax(0, 1fr); width: min(100%, 34rem); gap: .7rem; }
        }

        @media (max-width: 420px) {
            .cards { gap: .6rem; }
            .counter { padding: .9rem .6rem; border-radius: 16px; }
            .counter .days .big { line-height: 1; }
            .counter { padding: .7rem .6rem; }
            .counter .detail { font-size: .7rem; }
        }


        /* ---------- tela de entrada (charada) ---------- */
        body.locked .content,
        body.locked .music-player { visibility: hidden; }

        /* Vídeo surpresa: pop-up "aceita uma surpresa?" e o player em tela cheia (preto e branco, com som) */
        /* Presente da surpresa: sobe pela tela (em vez de cair como o coração); se tocar, abre o vídeo surpresa */
        .rising-gift { position: fixed; bottom: 0; z-index: 9990; padding: 0; border: 0; background: none; cursor: pointer; font-size: 3.6rem; line-height: 1; filter: drop-shadow(0 4px 12px rgba(0, 0, 0, .55)); animation: riseUp 11s linear forwards; will-change: transform; -webkit-tap-highlight-color: transparent; }
        .rising-gift > span { display: block; animation: swayGift 2.4s ease-in-out infinite; transform-origin: 50% 100%; }
        @keyframes riseUp { from { transform: translateY(110%); } to { transform: translateY(calc(-100vh - 110%)); } }
        @keyframes swayGift { 0%, 100% { transform: translateX(-18px) rotate(-8deg); } 50% { transform: translateX(18px) rotate(8deg); } }
        @media (prefers-reduced-motion: reduce) { .rising-gift > span { animation: none; } }
        /* Sair: volta para a charada */
        #sair { position: fixed; top: max(.7rem, env(safe-area-inset-top)); right: .8rem; z-index: 60; min-height: 36px; padding: 0 .95rem; border-radius: 999px; border: 1px solid var(--glass-line); background: var(--glass); color: #fff; font: inherit; font-size: .82rem; font-weight: 600; letter-spacing: .02em; cursor: pointer; backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); }
        #sair:hover { border-color: var(--gold); }
        body.locked #sair { display: none; }
        #surp-player { position: fixed; inset: 0; z-index: 21000; background: #000; display: grid; place-items: center; }
        #surp-player[hidden] { display: none; }
        #surp-video { width: 100%; height: 100%; object-fit: contain; background: #000; }
        #surp-fechar { position: absolute; top: max(.8rem, env(safe-area-inset-top)); right: .8rem; width: 44px; height: 44px; border-radius: 50%; border: 1px solid rgba(255, 255, 255, .35); background: rgba(0, 0, 0, .45); color: #fff; font-size: 1.2rem; cursor: pointer; }
        #gate {
            position: fixed;
            inset: 0;
            z-index: 20000;
            display: grid;
            place-items: center;
            padding: max(1rem, env(safe-area-inset-top)) 1rem max(1rem, env(safe-area-inset-bottom));
            background: rgba(26, 15, 31, .55);
            backdrop-filter: blur(18px) saturate(130%);
            -webkit-backdrop-filter: blur(18px) saturate(130%);
            transition: opacity .6s ease, visibility .6s ease;
        }
        #gate[hidden] { display: none; }
        #gate.open { opacity: 0; visibility: hidden; pointer-events: none; }

        .gate-card {
            width: min(100%, 26rem);
            text-align: center;
            padding: 1.8rem 1.4rem 1.4rem;
            border-radius: 24px;
            background: var(--glass);
            border: 1px solid var(--glass-line);
            box-shadow: 0 20px 60px rgba(0, 0, 0, .45);
            animation: fadeUp .7s ease both;
        }
        .gate-heart { font-size: 2.2rem; animation: beat 1.6s ease-in-out infinite; }
        @keyframes beat { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.18); } }

        .gate-title {
            font-family: var(--serif);
            font-style: italic;
            font-weight: 700;
            font-size: 1.7rem;
            margin: .4rem 0 .2rem;
        }
        .gate-sub { font-size: .8rem; letter-spacing: .12em; text-transform: uppercase; color: var(--ink-soft); }

        #gate-q {
            margin: 1.2rem 0 1.1rem;
            font-family: var(--serif);
            font-size: 1.15rem;
            line-height: 1.5;
            color: var(--gold);
            text-shadow: 0 2px 10px rgba(0, 0, 0, .5);
        }

        #gate-form { display: flex; gap: .5rem; }
        #gate-input {
            flex: 1;
            min-width: 0;
            padding: .8rem 1rem;
            font: 500 16px var(--sans);
            color: var(--ink);
            background: rgba(255, 255, 255, .12);
            border: 1px solid var(--glass-line);
            border-radius: 14px;
            text-align: center;
        }
        #gate-input::placeholder { color: var(--ink-soft); }
        #gate-input:focus { outline: 2px solid var(--gold); outline-offset: 2px; }

        .gate-btn {
            padding: .8rem 1.1rem;
            font: 600 .95rem var(--sans);
            color: #1a0f1f;
            background: var(--rose);
            border: 0;
            border-radius: 14px;
            cursor: pointer;
        }
        .gate-btn:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }

        #gate-msg { min-height: 1.4rem; margin-top: .8rem; font-size: .9rem; color: var(--ink); }
        #gate-msg.err { color: #ffb3c1; }
        .gate-links { display: flex; justify-content: center; gap: 1.2rem; margin-top: .4rem; }
        .gate-link {
            background: none; border: 0; cursor: pointer;
            font: 500 .8rem var(--sans); color: var(--ink-soft);
            text-decoration: underline; text-underline-offset: 3px;
        }
        .gate-link:hover { color: var(--ink); }
        #gate.shake .gate-card { animation: shake .4s ease; }
        @keyframes shake { 20%, 60% { transform: translateX(-8px); } 40%, 80% { transform: translateX(8px); } }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; }
        }
    </style>
</head>
<body class="locked">

    <img id="iconImage" src="iconsuh.png" alt="Imagem do Suh" onclick="openFlapSuh()" />

    <video class="video-background" id="video-bg" autoplay muted playsinline preload="auto">
        <source id="video-source" src="suh1.mp4" type="video/mp4">
        Seu navegador não suporta a tag de vídeo.
    </video>

    <audio id="background-music" loop>
        <source src="OutraVida.mp3" type="audio/mp3">
        Seu navegador não suporta a tag de áudio.
    </audio>

    <div class="falling-heart">❤️</div>

    <main class="content" id="content">
        <div id="timer">10</div>

        <h2 class="names">Suh <span>&amp;</span> Lele</h2>

        <h1 id="days-together-second"><span class="big">0</span><span class="unit">dias juntos</span></h1>

        <p id="current-date"></p>

        <div class="cards">
            <section class="counter" id="first-life">
                <h2>Primeira Vida</h2>
                <p class="date" id="first-life-date">25/04/2023</p>
                <p class="days"><span class="big" id="first-days">0</span><span class="unit">dias juntos</span></p>
                <p class="detail" id="first-detail"></p>
            </section>

            <section class="counter" id="second-life">
                <h2>Na Outra Vida</h2>
                <p class="date" id="second-life-date">16/12/2024</p>
                <p class="days"><span class="big" id="second-days">0</span><span class="unit">dias juntos</span></p>
                <p class="detail" id="second-detail"></p>
            </section>

            <section class="counter" id="namoro">
                <h2>Namoro</h2>
                <p class="date" id="namoro-date">16/05/2025</p>
                <p class="days"><span class="big" id="namoro-days">0</span><span class="unit">dias juntos</span></p>
                <p class="detail" id="namoro-detail"></p>
            </section>
        </div>
    </main>

    <div class="music-player" id="music-player">
        <div class="tap-message" id="tapMessage">Toque na tela para o menu voltar!</div>
        <button id="playButton" class="play-button" type="button">
            <span class="icon" aria-hidden="true"></span>
            <span>
                <div class="button-label" id="buttonLabel">Tocar Música</div>
                <div class="music-name" id="musicName">Armandinho - Outra Vida</div>
            </span>
        </button>
    </div>


    <button type="button" id="sair">Sair</button>
    <div id="surp-player" hidden>
        <video id="surp-video" playsinline preload="none"></video>
        <button type="button" id="surp-fechar" aria-label="Fechar a surpresa">✕</button>
    </div>
    <div id="gate" role="dialog" aria-modal="true" aria-labelledby="gate-title">
        <div class="gate-card">
            <div class="gate-heart" aria-hidden="true">💛</div>
            <h2 class="gate-title" id="gate-title">Só entra quem sabe</h2>
            <p class="gate-sub">Uma charada do nosso amor</p>
            <p id="gate-q">Carregando a charada…</p>
            <form id="gate-form" autocomplete="off">
                <input id="gate-input" type="text" inputmode="text" enterkeyhint="go" placeholder="sua resposta" aria-label="Resposta da charada" autocapitalize="off" autocorrect="off" spellcheck="false">
                <button class="gate-btn" type="submit">Entrar</button>
            </form>
            <p id="gate-msg" role="status" aria-live="polite"></p>
            <div class="gate-links">
                <button class="gate-link" id="gate-hint" type="button">Preciso de uma dica</button>
                <button class="gate-link" id="gate-next" type="button">Outra charada</button>
            </div>
        </div>
    </div>

    <script>
        /* PADRÃO DOS VÍDEOS DE FUNDO (detalhes no README.md)
           - preto e branco, 1080x1920, H.264 sem áudio, 30 fps, "faststart", nome suhNN.mp4
           - vídeo com mais de 15 s NÃO precisa ser cortado: o site toca 15 s, pula para o
             próximo e, quando ele for sorteado de novo, continua de onde parou (SEG_MAX/LONG_MIN)
           - novo vídeo: incluir em videoSources e, se for para aparecer inteiro, em noCrop */
        const videoSources = ["suh1.mp4", "suh2.mp4", "suh3.mp4", "suh5.mp4", "suh6.mp4", "suh8.mp4", "suh9.mp4", "suh10.mp4", "suh11.mp4", "suh12.mp4", "suh13.mp4", "suh14.mp4", "suh15.mp4", "suh16.mp4", "suh17.mp4", "suh18.mp4", "suh19.mp4", "suh21.mp4", "suh22.mp4", "suh23.mp4", "suh24.mp4"];
        const noCrop = ["suh11.mp4", "suh12.mp4", "suh13.mp4", "suh14.mp4", "suh15.mp4", "suh16.mp4", "suh17.mp4", "suh18.mp4", "suh19.mp4", "suh21.mp4", "suh22.mp4", "suh23.mp4", "suh24.mp4"]; // verticais completos: mostrar inteiros
        let playedVideos = []; // vídeos já exibidos no ciclo atual (o primeiro é sorteado)

        const audioElement = document.getElementById('background-music');
        const playButton = document.getElementById('playButton');
        const buttonLabel = document.getElementById('buttonLabel');
        const musicName = document.getElementById('musicName');
        const musicPlayer = document.getElementById('music-player');
        const content = document.getElementById('content');
        const timerDisplay = document.getElementById('timer');
        const tapMessage = document.getElementById('tapMessage');
        const daysTogetherSecond = document.getElementById('days-together-second');

        const startDateFirstLife = new Date('2023-04-25T00:00:00').getTime();
        const startDateSecondLife = new Date('2024-12-16T00:00:00').getTime();
        const startDateNamoro = new Date('2025-05-16T00:00:00').getTime();

        // Função para pré-carregar todos os vídeos
        function preloadVideos() {
            videoSources.forEach(src => {
                const video = document.createElement('video');
                video.src = src;
                video.preload = 'metadata'; // só metadados: baixar tudo de uma vez travava o vídeo atual
            });
        }

        function playNextVideo() {
    document.getElementById('video-bg').muted = true; // o fundo em loop nunca toca som
    // Todos tocam uma vez, em ordem aleatória, antes de qualquer um repetir.
    // Ao virar o ciclo, o último vídeo exibido não pode abrir o ciclo novo.
    const last = playedVideos[playedVideos.length - 1];
    if (playedVideos.length >= videoSources.length) {
        playedVideos = [];
    }
    let pool = videoSources.filter(video => !playedVideos.includes(video));
    if (pool.length > 1) pool = pool.filter(video => video !== last);
    const nextVideo = pool[Math.floor(Math.random() * pool.length)];

    // Adiciona o vídeo atual à lista de reproduzidos
    playedVideos.push(nextVideo);

    // Atualiza o vídeo no elemento HTML
    const videoElement = document.getElementById('video-source');
    videoElement.src = nextVideo;

    // vídeos da lista noCrop aparecem inteiros, sem cortar
    document.getElementById('video-bg').style.objectFit = noCrop.includes(nextVideo) ? 'contain' : '';

    const videoBg = document.getElementById('video-bg');
    videoBg.style.opacity = 0; // Transição suave
    setTimeout(() => {
        videoBg.load(); // Recarrega o vídeo

window.addEventListener("load", () => {

    function checkForAppearance() {
        const chance = Math.random();  // Gera um valor aleatório entre 0 e 1

        // Se o valor aleatório for menor que 0.4, a imagem aparecerá
        if (chance < 0.4) {
            // Configura a altura aleatória
            iconImage.style.bottom = `${getRandomY()}%`;  // Nova posição aleatória
            iconImage.style.opacity = 0.7;  // 70% de opacidade
            iconImage.style.animationPlayState = 'running';  // Inicia a animação
        }
    }

    // A imagem começa invisível e sem animação, sem afetar o layout da página
    iconImage.style.opacity = 0;
    iconImage.style.animationPlayState = 'paused';
    
    // A imagem será posicionada fora do fluxo normal, para não interferir em nada
    iconImage.style.position = 'fixed'; // Usamos fixed para garantir que não interfira no layout
    iconImage.style.zIndex = '100'; // Garantir que a imagem fique acima de outros elementos

    // Chama a função de verificação pela primeira vez com base na probabilidade
    setTimeout(checkForAppearance, 0);  // Inicia logo após o carregamento, com a verificação da probabilidade

        const anos = n => hoje[0] - n[0] - ((hoje[1] < n[1] || (hoje[1] === n[1] && hoje[2] < n[2])) ? 1 : 0);
        const meses = n => (hoje[0] - n[0]) * 12 + (hoje[1] - n[1]) - (hoje[2] < n[2] ? 1 : 0);
        const norm = s => String(s).normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase();
        const letras = s => norm(s).replace(/[^a-z]/g, '').length;
        const vogais = s => (norm(s).match(/[aeiou]/g) || []).length;
        const somaDigitos = a => (String(a[2]).padStart(2, '0') + String(a[1]).padStart(2, '0') + a[0])
            .split('').reduce((t, d) => t + Number(d), 0);
        const proxNamoro = () => {
            let y = hoje[0];
            if (dias(hoje, [y, D.namoro[1], D.namoro[2]]) < 0) y++;
            return dias(hoje, [y, D.namoro[1], D.namoro[2]]);
        };

        // número por extenso (0–999), para aceitar "quarenta e seis"
        function extenso(n) {
            const u = ['zero','um','dois','tres','quatro','cinco','seis','sete','oito','nove','dez','onze','doze','treze','quatorze','quinze','dezesseis','dezessete','dezoito','dezenove'];
            const d = ['','','vinte','trinta','quarenta','cinquenta','sessenta','setenta','oitenta','noventa'];
            const c = ['','cento','duzentos','trezentos','quatrocentos','quinhentos','seiscentos','setecentos','oitocentos','novecentos'];
            if (n < 20) return u[n];
            if (n < 100) return d[Math.floor(n / 10)] + (n % 10 ? ' e ' + u[n % 10] : '');
            if (n === 100) return 'cem';
            return c[Math.floor(n / 100)] + (n % 100 ? ' e ' + extenso(n % 100) : '');
        }
        const num = n => [String(n), extenso(n)];

        const CHARADAS = [
            { q: 'Na Primeira Vida nosso dia foi 25. Na Outra Vida, 16. No namoro, 16. Some os três dias e abra o meu coração.',
              a: () => num(D.primeira[2] + D.outra[2] + D.namoro[2]), dica: 'Só os dias, sem os meses nem os anos.' },
            { q: 'Abril, dezembro e maio: os três meses em que nossa história mudou de capítulo. Quanto dá a soma dos números desses meses?',
              a: () => num(4 + 12 + 5), dica: 'Abril é o 4º mês do ano.' },
            { q: 'Quantos anos o universo me fez esperar por ela? Conte a diferença entre o ano em que eu nasci e o ano em que ela nasceu.',
              a: () => num(D.suelen[0] - D.leandro[0]), dica: 'Os anos de nascimento terminam em 82 e 89.' },
            { q: 'Somando a minha idade e a dela, hoje, quanto tempo de vida já foi dado a nós dois?',
              a: () => num(anos(D.leandro) + anos(D.suelen)), dica: 'Some as duas idades de hoje.' },
            { q: 'Quantas letras têm, juntos, os nossos nomes completos? Suelen Arruda e Leandro Batista, sem contar os espaços.',
              a: () => num(letras(NOME_S) + letras(NOME_L)), dica: 'Conte letra por letra.' },
            { q: 'O meu nome completo e o dela têm exatamente a mesma quantidade de vogais. Quantas são?',
              a: () => num(vogais(NOME_L)), dica: 'Leandro Batista: a, e, o, a, i, a…' },
            { q: 'Quantos dias a Outra Vida levou para virar namoro?',
              a: () => num(dias(D.outra, D.namoro)), dica: 'De 16/12/2024 até 16/05/2025.' },
            { q: 'Quantos dias separam a nossa Primeira Vida da Outra Vida?',
              a: () => num(dias(D.primeira, D.outra)), dica: 'De 25/04/2023 até 16/12/2024.' },
            { q: 'Quantos meses completos de namoro nós já vivemos até hoje?',
              a: () => num(meses(D.namoro)), dica: 'O namoro começou em 16/05/2025.' },
            { q: 'Quantos dias faltam para o próximo aniversário de namoro?',
              a: () => num(proxNamoro()), dica: 'O aniversário é todo dia 16 de maio.' },
            { q: 'Qual é o mês, mais perto do Natal, em que a Outra Vida nasceu?',
              a: () => ['dezembro'], dica: 'É o último mês do ano.' },
            { q: 'O nosso namoro começou no dia 16 do mês 5. Multiplique um pelo outro.',
              a: () => num(D.namoro[1] * D.namoro[2]), dica: 'Dezesseis vezes cinco.' },
            { q: 'Escreva a data em que ela nasceu, só os números (dia, mês e ano), e some todos os dígitos.',
              a: () => num(somaDigitos(D.suelen)), dica: 'São 8 dígitos, e o ano termina em 89.' },
            { q: 'Escreva a minha data de nascimento só com os números (dia, mês e ano) e some todos os dígitos.',
              a: () => num(somaDigitos(D.leandro)), dica: 'São 8 dígitos, e o ano termina em 82.' },
            { q: 'Eu e ela fazemos aniversário em meses vizinhos. Quem faz primeiro no calendário? Responda com o primeiro nome.',
              a: () => ['suelen'], dica: 'Fevereiro vem antes de março.' },
            { q: 'Tem uma música que é a trilha da nossa história e que fala de uma segunda chance. Qual é o nome dela?',
              a: () => ['outra vida', 'a outra vida'], dica: 'É a música que toca aqui no site.' },
            { q: 'Quem canta a nossa música, aquela que fala de uma Outra Vida? Responda com o nome do artista.',
              a: () => ['armandinho'], dica: 'Ele é de Florianópolis e tem um nome que termina em "inho".' },
            { q: 'Conte as letras do nome do artista da nossa música e as do nome da própria música, sem espaços: Armandinho e Outra Vida.',
              a: () => num(letras('Armandinho') + letras('Outra Vida')), dica: 'Armandinho tem 10 letras.' },
            { q: 'Quantos anos completos já se passaram desde que a nossa Primeira Vida começou?',
              a: () => num(anos(D.primeira)), dica: 'Foi em 25/04/2023.' }
        ];

        const body = document.body;
        const gate = document.getElementById('gate');
        const qEl = document.getElementById('gate-q');
        const input = document.getElementById('gate-input');
        const msg = document.getElementById('gate-msg');
        const store = {
            get(k) { try { return sessionStorage.getItem(k); } catch (e) { return null; } },
            set(k, v) { try { sessionStorage.setItem(k, v); } catch (e) {} }
        };

        function abrir() {
            gate.classList.add('open');
            body.classList.remove('locked');
            store.set('suh-ok', '1');
            if (typeof resetHideTimer === 'function') resetHideTimer();
            setTimeout(() => { gate.hidden = true; }, 700);
            // ?surpresa=1 na URL solta o presente já na entrada (para testar). O sorteio normal é a cada início de vídeo de fundo.
            if (/[?&]surpresa=1\b/.test(location.search)) setTimeout(soltarSurpresa, 2200);
        }

        // Vídeo surpresa: um presente sobe pela tela; se a pessoa tocar, toca o vídeo. Só baixa o vídeo no toque (preload none, src definido no clique).
        function soltarSurpresa() {
            const g = document.createElement('button');
            g.type = 'button';
            g.className = 'rising-gift';
            g.setAttribute('aria-label', 'Um presente! Toque para abrir a surpresa');
            g.style.left = (12 + Math.random() * 66) + 'vw';
            g.innerHTML = '<span aria-hidden="true">🎁</span>';
            g.addEventListener('animationend', e => { if (e.target === g) g.remove(); });
            g.addEventListener('click', e => { e.stopPropagation(); g.remove(); tocarSurpresa(); });
            document.body.appendChild(g);
        }
        function tocarSurpresa() {
            const player = document.getElementById('surp-player');
            const vid = document.getElementById('surp-video');
            const musica = document.getElementById('background-music');
            const bg = document.getElementById('video-bg');
            function fecharPlayer() {
                vid.pause();
                player.hidden = true;
                vid.removeAttribute('src');
                vid.load();
                window.__surpresaAtiva = false;
                if (bg) bg.play().catch(() => {});
            }
            window.__surpresaAtiva = true;
            if (musica && !musica.paused) { musica.pause(); const lb = document.getElementById('buttonLabel'); if (lb) lb.innerText = 'Tocar Música'; }
            if (bg) bg.pause();
            vid.src = 'surpresa.mp4';
            player.hidden = false;
            vid.play().catch(() => { vid.muted = true; vid.play().catch(() => {}); });
            vid.onended = fecharPlayer;
            document.getElementById('surp-fechar').onclick = fecharPlayer;
        }

        window.__soltarPresente = soltarSurpresa; // o sorteio contínuo (sortearEasterEgg) fica no script principal, junto com o do coração

        // Sair: apaga a sessão e volta para a charada.
        document.getElementById('sair').addEventListener('click', () => {
            try { sessionStorage.removeItem('suh-ok'); sessionStorage.removeItem('suh-resume'); } catch (e) {}
            location.reload();
        });

        if (store.get('suh-ok') === '1') {
            gate.hidden = true;
            gate.classList.add('open');
            body.classList.remove('locked');
            return;
        }

        let atual = -1;
        function sortear() {
            let i;
            do { i = Math.floor(Math.random() * CHARADAS.length); }
            while (CHARADAS.length > 1 && i === atual);
            atual = i;
            qEl.textContent = CHARADAS[i].q;
            input.value = '';
            msg.textContent = '';
            msg.className = '';
        }

        document.getElementById('gate-form').addEventListener('submit', e => {
            e.preventDefault();
            const resp = norm(input.value).replace(/[^a-z0-9 ]/g, '').replace(/\s+/g, ' ').trim();
            if (!resp) return;
            const certas = CHARADAS[atual].a().map(x => norm(x));
            if (certas.includes(resp)) {
                acertou();
            } else {
                // Senha mestra: entra sem acertar a charada (guardada só como hash).
                senhaMestra(resp).then(ok => { if (ok) acertou(); else errou(); });
            }
        });
        function acertou() {
            msg.className = '';
            msg.textContent = 'Era essa mesmo, meu amor. Pode entrar. 💛';
            setTimeout(abrir, 700);
        }
        function errou() {
            msg.className = 'err';
            msg.textContent = 'Quase lá! Pensa com carinho e tenta de novo.';
            gate.classList.remove('shake'); void gate.offsetWidth; gate.classList.add('shake');
            input.select();
        }
        // Senha mestra: só o hash SHA-256 fica no código (a frase em si não aparece no repositório).
        const MESTRA = 'd36ba1ef48f0bc34c82d74e8403cd049a946537f2e0611bcb655d04068b0ea00';
        async function senhaMestra(resp) {
            try {
                if (!window.crypto || !crypto.subtle) return false;
                const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(resp.replace(/ /g, '')));
                return Array.from(new Uint8Array(buf)).map(x => x.toString(16).padStart(2, '0')).join('') === MESTRA;
            } catch (e) { return false; }
        }
        document.getElementById('gate-hint').addEventListener('click', () => {
            msg.className = '';
            msg.textContent = 'Dica: ' + CHARADAS[atual].dica;
        });
        document.getElementById('gate-next').addEventListener('click', () => { sortear(); input.focus(); });

        sortear();
    })();
    } catch (err) {
        const q = document.getElementById('gate-q');
        if (q) q.textContent = 'Não consegui carregar a charada (' + (err && err.message ? err.message : err) + '). Recarregue a página.';
        if (window.console) console.error(err);
    }
    </script>
