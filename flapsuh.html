<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minimal Flap Game</title>
    <style>
    body {
        margin: 0;
        overflow: hidden;
        display: flex;
        flex-direction: column;  /* Para organizar os elementos em coluna */
        justify-content: flex-start;  /* Alinha os itens ao topo */
        align-items: center;  /* Mantém o conteúdo centralizado horizontalmente */
        height: 100vh;
        color: white;
        font-family: Arial, sans-serif;
    }
    canvas {
        background: white;
        /* o canvas guarda 320x480; aqui ele só é ampliado para caber na tela, sem cortar (proporção 2:3) */
        height: min(100vh, 150vw);
        width: auto;
        aspect-ratio: 2 / 3;
    }
    #desistir { position: fixed; inset: 0; z-index: 50; display: none; place-items: center; padding: 1rem; background: rgba(10, 5, 14, .75); }
    #desistir.show { display: grid; }
    .desistir-card { width: min(20rem, 100%); padding: 1.4rem 1.2rem; text-align: center; color: #fff; border: 1px solid rgba(255, 255, 255, .25); border-radius: 20px; background: rgba(30, 14, 36, .92); }
    .desistir-card p { margin: 0 0 1rem; font-size: 1.15rem; line-height: 1.35; }
    .desistir-btns { display: flex; gap: .7rem; justify-content: center; }
    .desistir-btns button { min-height: 44px; min-width: 96px; border-radius: 999px; border: 1px solid rgba(255, 255, 255, .4); background: transparent; color: #fff; font: inherit; font-weight: 700; cursor: pointer; }
    .desistir-btns button.sim { background: #ffd86b; color: #2a1500; border-color: #ffd86b; }
    #d-choro { font-size: 1.05rem; }
    #d-voltar { min-height: 44px; padding: 0 1.4rem; border-radius: 999px; border: 1px solid rgba(255, 255, 255, .55); background: rgba(255, 255, 255, .12); color: #fff; font: inherit; font-weight: 700; cursor: pointer; opacity: .55; transition: opacity .2s; }
    #d-voltar:hover, #d-voltar:focus-visible { opacity: 1; }
    #d-eba { padding: .4rem 0 .2rem; }
    #d-eba .eba-cara { display: block; font-size: 4.2rem; line-height: 1.1; animation: pula .4s ease-in-out infinite alternate; }
    #d-eba .eba-txt { margin: .2rem 0 0; font-size: 2.1rem; font-weight: 800; letter-spacing: .06em; color: #ffd86b; animation: estoura .45s ease-out; }
    @keyframes pula { from { transform: translateY(2px) rotate(-8deg) scale(1); } to { transform: translateY(-10px) rotate(8deg) scale(1.12); } }
    @keyframes estoura { from { transform: scale(.3); opacity: 0; } 70% { transform: scale(1.25); opacity: 1; } to { transform: scale(1); } }
    .confete { position: fixed; left: 50%; top: 50%; z-index: 60; font-size: 1.6rem; pointer-events: none; animation: confete 1.3s ease-out forwards; }
    @keyframes confete { from { transform: translate(-50%, -50%) scale(.4); opacity: 1; } to { transform: translate(calc(-50% + var(--dx)), calc(-50% + var(--dy))) rotate(var(--rot)) scale(1); opacity: 0; } }
    @media (prefers-reduced-motion: reduce) { #d-eba .eba-cara, #d-eba .eba-txt, .confete { animation: none; } }
    #d-choro .chora { display: block; font-size: 3.4rem; animation: chora .6s ease-in-out infinite alternate; }
    @keyframes chora { from { transform: translateY(0) rotate(-6deg); } to { transform: translateY(6px) rotate(6deg); } }
    #message, #instructions {
        position: absolute;
        font-size: 28px;
        text-align: center;
        color: black;
        width: 100%;
    }
    #message {
        top: 20%;  /* Ajuste a distância do topo */
        transform: translateY(-50%);
    }
    #instructions {
        top: 10%;  /* Ajuste a distância do topo */
        transform: translateY(-50%);
    }
    #buttons {
        position: absolute;
        top: 95%;
        display: flex;
        justify-content: center;
        width: 100%;
    }
    #buttons div {
        margin: 0 30px;
        font-size: 20px;
        cursor: pointer;
    }
    #prizeLink {
        font-size: 24px;
        color: blue;
        text-decoration: underline;
        cursor: pointer;
    }

    /* Estilo do vídeo */
    #prizeVideo {
        display: none; /* Inicialmente escondido */
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        object-fit: cover; /* Isso vai garantir que o vídeo cubra toda a tela, mantendo a proporção */
        z-index: 10; /* Garante que o vídeo fique sobre a tela de jogo */
    }

    @media (max-width: 480px) {
        #instructions {
            font-size: 20px;
            top: 20%;
            transform: translateY(-50%);
        }
        #message {
            font-size: 28px;
            top: 30%;
            transform: translateY(-50%);
        }
        #buttons {
            top: 95%;
        }
    }
</style>

</head>
<body>
    <div id="instructions">Passe por 20 Obstaculos! </p> Toque para iniciar!</div>
    <div id="message">
        <div id="congratulations"></div>
        <div id="prizeLink" onclick="openPrize()">Clique aqui para abrir o seu prêmio!</div>
        <div id="buttons">
            <div id="continue">Reiniciar</div>
            <div id="quit">Desistir</div>
        </div>
    </div>
    <div id="desistir" role="dialog" aria-modal="true" aria-labelledby="desistir-q">
        <div class="desistir-card">
            <div id="d-pergunta">
                <p id="desistir-q">Você quer mesmo desistir do nosso amor? 💔</p>
                <div class="desistir-btns"><button type="button" id="d-sim">Sim</button><button type="button" class="sim" id="d-nao">Não</button></div>
            </div>
            <div id="d-choro" hidden><span class="chora" aria-hidden="true">😭</span><p>Então tá… eu vou ficar aqui chorando…</p><button type="button" id="d-voltar">Voltar ao jogo</button></div>
            <div id="d-eba" hidden><span class="eba-cara" aria-hidden="true">🥳</span><p class="eba-txt">EBA!!!</p></div>
        </div>
    </div>
    <canvas id="gameCanvas"></canvas>
    <audio id="bgMusic" src="outravida.mp3" loop></audio>
    <audio id="flapSound" src="flap-sound.mp3"></audio>
    <audio id="toySound" src="toy.mp3"></audio>
    <audio id="prizeAudio" src="lele.mp3"></audio>
    
    <!-- Vídeo do prêmio -->
    <video id="prizeVideo" autoplay>
        <source src="lele4.mp4" type="video/mp4">
        Seu navegador não suporta o formato de vídeo MP4.
    </video>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");
        const message = document.getElementById("message");
        const instructions = document.getElementById("instructions");
        const bgMusic = document.getElementById("bgMusic");
        const flapSound = document.getElementById("flapSound");
        const toySound = document.getElementById("toySound");
        const continueButton = document.getElementById("continue");
        const quitButton = document.getElementById("quit");
        const congratulations = document.getElementById("congratulations");
        const prizeLink = document.getElementById("prizeLink");
        const prizeAudio = document.getElementById("prizeAudio");
        const prizeVideo = document.getElementById("prizeVideo");

        const birdImage = new Image();
        birdImage.src = "iconsuh.png"; // Caminho para o arquivo do pássaro
        canvas.width = 320;
        canvas.height =  480;

        let bird = { x: 50, y: 200, size: 40, velocity: 0, gravity: 0.05, lift: -3, rotation: 0, rotationDirection: 1 };
        let pipes = [];
        let frame = 0;
        let gameOver = false;
        let gameStarted = false;
        let obstacleCount = 0;
        let score = 20;
        let gamePaused = false;
        let backgroundColorIndex = 0;
        let firstTouch = true; // Variável para verificar o primeiro toque

        const backgroundColors = [
            "white", "#87CEEB", "#FFFACD", "red"
        ];

        function resetGame() {
            bird.y = 150;
            bird.velocity = 0;
            bird.rotation = 0;
            bird.rotationDirection = 1;
            pipes = [];
            frame = 0;
            gameOver = false;
            obstacleCount = 0;
            score = 20;
            gamePaused = false;
            message.style.display = "none";
            instructions.style.display = "block";
            bgMusic.currentTime = 0;
            bgMusic.pause();
            bgMusic.volume = 0.2;
            backgroundColorIndex = 0;
            firstTouch = true; // Reseta o primeiro toque
            prizeAudio.pause(); // Pausa o áudio do prêmio
            prizeAudio.currentTime = 0; // Reseta o áudio do prêmio
            prizeVideo.pause(); // Pausa o vídeo
            prizeVideo.currentTime = 0; // Reseta o vídeo
            prizeVideo.style.display = "none"; // Esconde o vídeo
        }

        function drawBird() {
            ctx.save();
            ctx.translate(bird.x, bird.y);
            ctx.rotate(bird.rotation * Math.PI / 180);
            ctx.globalAlpha = 0.8;
            ctx.drawImage(birdImage, -bird.size, -bird.size, bird.size * 2, bird.size * 2);
            ctx.restore();
            ctx.globalAlpha = 1;
        }

        function drawPipes() {
            ctx.fillStyle = "black";
            pipes.forEach(pipe => {
                ctx.fillRect(pipe.x, 0, pipe.width, pipe.top);
                ctx.fillRect(pipe.x, canvas.height - pipe.bottom, pipe.width, pipe.bottom);
            });
        }

        function drawScore() {
            ctx.fillStyle = "black";
            ctx.font = "40px Arial";
            ctx.fillText("Meta: " + score, 10, 60);
        }

        function updateBird() {
            bird.velocity += bird.gravity;
            bird.y += bird.velocity;
            if (bird.y + bird.size / 2 > canvas.height || bird.y - bird.size / 2 < 0) {
                gameOver = true;
            }
        }

        let pipeSpacing = 350;

        function updatePipes() {
            let gap;
            if (obstacleCount < 5) {
                gap = 240;
            } else if (obstacleCount < 10) {
                gap = 200;
            } else if (obstacleCount < 15) {
                gap = 180;
            } else {
                gap = 160;
            }

            if (frame % 90 === 0) {
                let top = Math.random() * (canvas.height / 2);
                pipes.push({ x: pipes.length > 0 ? pipes[pipes.length - 1].x + pipeSpacing : canvas.width, width: 40, top: top, bottom: canvas.height - top - gap });
                obstacleCount++;
            }
            pipes.forEach(pipe => pipe.x -= 1.5);
            pipes = pipes.filter(pipe => pipe.x + pipe.width > 0);
        }

        function checkCollision() {
            pipes.forEach(pipe => {
                if (bird.x + bird.size / 2 > pipe.x && bird.x - bird.size / 2 < pipe.x + pipe.width) {
                    if (bird.y - bird.size / 2 < pipe.top || bird.y + bird.size / 2 > canvas.height - pipe.bottom) {
                        gameOver = true;
                    }
                }
            });
        }

        function checkScore() {
            pipes.forEach(pipe => {
                if (pipe.x + pipe.width < bird.x && !pipe.passed) {
                    pipe.passed = true;
                    score--;
                    if (score < 0) score = 0;  // Impede o score de ficar negativo
                    pipe.color = "white";
                } else if (pipe.x + pipe.width >= bird.x) {
                    pipe.color = "black";
                }
            });
        }

        function updateBackgroundColor() {
            if (score <= 15 && score > 10) {
                backgroundColorIndex = 1;
            } else if (score <= 10 && score > 5) {
                backgroundColorIndex = 2;
            } else if (score <= 5 && score > 0) {
                backgroundColorIndex = 3;
            }
        }

        function rotateBird() {
            const rotationStep = 2;
            bird.rotation += bird.rotationDirection * rotationStep;
            if (bird.rotation >= 360) {
                bird.rotation = 0;
            }
        }

        function gameLoop() {
            if (gamePaused) return;

            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = backgroundColors[backgroundColorIndex];
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            if (gameOver) {
                message.style.display = "block";
                if (score <= 0) {
                    congratulations.textContent = "Parabéns!";
                    prizeLink.style.display = "block"; // Exibe o link
                    document.getElementById("buttons").style.display = "none"; // Esconde os botões
                } else {
                    congratulations.textContent = "Você Perdeu!";
                    document.getElementById("buttons").style.display = "block"; // Exibe os botões
                    prizeLink.style.display = "none"; // Esconde o link
                }
                gamePaused = true;
                return;
            }

            drawBird();
            drawPipes();
            drawScore();
            updateBird();
            updatePipes();
            checkCollision();
            checkScore();
            updateBackgroundColor();
            rotateBird();
            frame++;

            requestAnimationFrame(gameLoop);
        }

        function handleUserInput() {
            if (gamePaused) return;

            if (!gameStarted) {
                gameStarted = true;
                message.style.display = "none";
                instructions.style.display = "none";
                bgMusic.play();
                gameLoop();
            }

            if (!firstTouch) {
                bird.velocity = bird.lift;
                flapSound.currentTime = 0;
                flapSound.play();
                rotateBird();
                toySound.currentTime = 0;
                toySound.volume = 0.1;
                toySound.play();
            } else {
                firstTouch = false;
            }
        }

        function handleContinue() {
            resetGame();
            gameStarted = false;
            document.getElementById("buttons").style.display = "block"; // Mostra novamente os botões
        }

        function handleQuit() {
            console.log("Jogo finalizado");
            sairDoJogo(false);
            bgMusic.pause(); // Pausa a música de fundo
            prizeVideo.muted = true; // Muta o vídeo no último segundo

        }

        function openPrize() {
        bgMusic.pause(); // Pausa a música de fundo
        prizeVideo.style.display = "block"; // Exibe o vídeo
        prizeVideo.play(); // Dá play no vídeo
        prizeAudio.play(); // Toca o áudio do prêmio

        // Monitorando o tempo do vídeo para mutar no último segundo
        prizeVideo.ontimeupdate = function() {
        if (prizeVideo.currentTime >= prizeVideo.duration - 1) {
            prizeVideo.muted = true; // Muta o vídeo no último segundo
        }
    };

    prizeVideo.onended = function() {
        handleQuit(); // Quando o vídeo terminar, simula o clique no botão "Desistir"
        }
    }



        continueButton.addEventListener("click", handleContinue);
        // Adicionar evento ao botão "Desistir"
        // Desistir é uma brincadeira: "Não" (não quero desistir do nosso amor) volta para o jogo; "Sim" chora e segura 30 segundos,
        // depois sai deixando um "Voltar ao jogo" apagado no site.
        const desistirBox = document.getElementById("desistir");
        const CHORO_MS = 30000;
        let choroTimer = null;
        function sairDoJogo(voltar) {
            if (window.parent && window.parent !== window) window.parent.postMessage({ tipo: "flap-sair", voltar: !!voltar }, location.origin);
            else window.location.href = "index.html";
        }
        quitButton.addEventListener("click", function() {
            document.getElementById("d-pergunta").hidden = false;
            document.getElementById("d-choro").hidden = true;
            document.getElementById("d-eba").hidden = true;
            desistirBox.classList.add("show");
        });
        document.getElementById("d-nao").addEventListener("click", function() {
            desistirBox.classList.remove("show");
            handleContinue();
        });
        // Na tela do choro há um "Voltar ao jogo" (apagado, fica nítido ao tocar): cancela a saída e volta ao jogo.
        function confete() {
            const emojis = ["🎉", "✨", "💛", "❤️", "🥳", "⭐"];
            for (let i = 0; i < 22; i++) {
                const c = document.createElement("span");
                c.className = "confete";
                c.textContent = emojis[i % emojis.length];
                const ang = Math.random() * Math.PI * 2, dist = 90 + Math.random() * 150;
                c.style.setProperty("--dx", Math.round(Math.cos(ang) * dist) + "px");
                c.style.setProperty("--dy", Math.round(Math.sin(ang) * dist) + "px");
                c.style.setProperty("--rot", Math.round(Math.random() * 360 - 180) + "deg");
                document.body.appendChild(c);
                setTimeout(function() { c.remove(); }, 1400);
            }
        }
        // Voltar da tela do choro: cara de alegria, "EBA!!!" e confete por um instante, e então volta ao jogo.
        document.getElementById("d-voltar").addEventListener("click", function() {
            clearTimeout(choroTimer);
            this.disabled = true;
            document.getElementById("d-choro").hidden = true;
            document.getElementById("d-eba").hidden = false;
            confete();
            setTimeout(function() {
                desistirBox.classList.remove("show");
                document.getElementById("d-eba").hidden = true;
                document.getElementById("d-voltar").disabled = false;
                handleContinue();
            }, 1400);
        });
        document.getElementById("d-sim").addEventListener("click", function() {
            document.getElementById("d-pergunta").hidden = true;
            document.getElementById("d-choro").hidden = false;
            clearTimeout(choroTimer);
            choroTimer = setTimeout(function() { bgMusic.pause(); sairDoJogo(true); }, CHORO_MS);
        });

        document.addEventListener("touchstart", handleUserInput);
        document.addEventListener("mousedown", handleUserInput);

        resetGame();
    </script>
</body>
</html>
